name: Publish Ladybird 2026.47.7-r1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-r1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release files
        run: sha256sum -c SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view v2026.47.7-r1 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create v2026.47.7-r1 \
            --verify-tag \
            --title 'Ladybird 2026.47.7-r1 for Alpine Linux' \
            --notes 'Alpine edge x86_64 package with musl sandbox syscall, ICU data access, and stack-size fixes. Tested with the sandbox enabled. See README.md for installation and Alpine 3.24 compatibility notes.' \
            ladybird-2026.47.7-r1.apk \
            builder@local-6b061501.rsa.pub \
            SHA256SUMS
